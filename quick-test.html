<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub System Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .test-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🚀 EventHub System Test</h1>
        <p>Testing core system functionality...</p>
        
        <button onclick="testDatabase()">Test Database</button>
        <button onclick="testAuth()">Test Authentication</button>
        <button onclick="testEvents()">Test Events</button>
        <button onclick="testBookings()">Test Bookings</button>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testDatabase() {
            addResult('Testing database connection...', 'info');
            
            try {
                const response = await fetch('/api/events.php?categories=1');
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Database connection successful - Found ${data.length} categories`, 'pass');
                } else {
                    addResult('❌ Database connection failed', 'fail');
                }
            } catch (error) {
                addResult(`❌ Database test error: ${error.message}`, 'fail');
            }
        }

        async function testAuth() {
            addResult('Testing authentication system...', 'info');
            
            try {
                const response = await fetch('/api/auth.php?action=check');
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Auth system working - Logged in: ${data.logged_in}`, 'pass');
                } else {
                    addResult('❌ Auth system failed', 'fail');
                }
            } catch (error) {
                addResult(`❌ Auth test error: ${error.message}`, 'fail');
            }
        }

        async function testEvents() {
            addResult('Testing events system...', 'info');
            
            try {
                const response = await fetch('/api/events.php');
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Events system working - Found ${data.length} events`, 'pass');
                } else {
                    addResult('❌ Events system failed', 'fail');
                }
            } catch (error) {
                addResult(`❌ Events test error: ${error.message}`, 'fail');
            }
        }

        async function testBookings() {
            addResult('Testing bookings system...', 'info');
            
            try {
                const response = await fetch('/api/bookings.php?user_id=1');
                if (response.ok || response.status === 400) {
                    addResult('✅ Bookings API accessible', 'pass');
                } else {
                    addResult('❌ Bookings system failed', 'fail');
                }
            } catch (error) {
                addResult(`❌ Bookings test error: ${error.message}`, 'fail');
            }
        }

        async function runAllTests() {
            clearResults();
            addResult('🚀 Starting comprehensive system test...', 'info');
            
            await testDatabase();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testAuth();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testEvents();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testBookings();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            addResult('✅ All tests completed!', 'pass');
        }

        // Auto-run tests on page load
        document.addEventListener('DOMContentLoaded', function() {
            addResult('EventHub System Test initialized', 'info');
            addResult('Click "Run All Tests" to start comprehensive testing', 'info');
        });
    </script>
</body>
</html>
